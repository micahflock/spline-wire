# The snap-fit printed chain: one part per link, no hardware. All lengths in mm.
# Use it with --chain data/chain-snap.yaml, or pick "snap" in the app's settings.
#
# Each link is a pin hanging from a conical head and a split sleeve at its
# tail that clips round the next link's pin, under that link's head. The
# heads and sleeves, round and centred on the pins, are what touches the
# target; the arm between them is narrower. A white rim round the top edge
# of every head is the fiducial. The link is 3DP_Link_Ver_MF (2026-11-17);
# experiments/snap_link_geometry.py reads these numbers from its STEP file.

# Pin axis to sleeve axis of one link.
pitch_mm: 13.0

# What touches the target, at its widest: the sleeve (4.393) and the head's
# top edge (4.395). Measure a printed sleeve across and halve it.
half_width_mm: 4.39

# What touches the target: the round sleeves and heads at the pins, not a
# straight link edge.
contact: round

# The rim on each head: 8.79 mm across, 0.86 mm wide (two perimeters),
# 0.4 mm tall, printed in white on top.
fiducial: ring
fiducial_mm: 8.79
ring_inner_mm: 7.07

# Printed the other way round, dark rims on light links? Add
# fiducial_shade: dark here, or choose Colours: dark in the app (the default
# is light: white rims on black links).

# Number of pins with a rim (one per link).
n_pins: 13

# The joint turns 102 degrees one way and 127 the other before the links
# collide, and perspective adds up to ~11 degrees in the photo. Past ~105
# degrees the pins either side of a joint come within 1.2 pitches of each
# other and at 120 they are one pitch apart, as if joined by a link, so
# sharper bends are not accepted: the chain then reads as cut there, or
# with the bend's pin left out, with a warning either way (docs/snap-chain.md
# has the numbers).
max_bend_deg: 110
