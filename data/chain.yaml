# Physical description of the measuring chain. All lengths in mm.
#
# Each link is a rigid bar between two pins, with semicircular ends
# centered on the pins. A fiducial is centered on every pin.

# Pin-to-pin distance. The only length the solver relies on to deskew the
# photo, so it should be as accurate as the chain can be made.
pitch_mm: 10.0

# Distance from the pin line to the edge of a link that touches the target
# curve (half the link width). Used to offset the measured pin line onto
# the target curve.
half_width_mm: 4.0

# Fiducial on each pin, light on the dark link: "dot" (a solid disc) or
# "ring" (an annulus; also set ring_inner_mm, its hole's diameter).
# fiducial_mm is the outer diameter. Keep at least 1.5 mm of dark link
# around it: detection tells a dot from other bright blobs by that margin.
# Dot vs ring for a 0.4 mm nozzle: docs/cv-robustness.md, section 5.
fiducial: dot
fiducial_mm: 5.0

# Number of pins (links + 1).
n_pins: 13
