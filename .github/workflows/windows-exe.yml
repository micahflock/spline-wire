name: Windows app

# Builds SplineWire.exe (desktop GUI) on Windows, smoke-tests it, and
# uploads it as a workflow artifact. Download it from the run's summary page.
# To publish a GitHub Release (exe and test plaques attached), bump __version__
# in splinewire/__init__.py, then either run this workflow on main from the
# Actions tab with "Publish a release" ticked, or push the tag v<version>.

on:
  push:
    branches: ["**"]
    tags: ["v*"]         # path filters don't apply to tag pushes
    paths:
      - "splinewire/**"
      - "data/**"
      - "fusion/**"
      - "packaging/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/windows-exe.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (tag v<__version__>; main only)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write    # create the release and its tag
    env:
      UV_PYTHON_DOWNLOADS: never   # use the python.org build below; its Tk bundles cleanly
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to publish a release
        id: release
        shell: pwsh
        run: |
          $version = (Select-String -Path splinewire/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$version"
          $publish = $false
          if ("${{ github.ref_type }}" -eq "tag") {
            if ($tag -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match __version__ $version" }
            $publish = $true
          } elseif ("${{ inputs.release }}" -eq "true") {
            if ("${{ github.ref }}" -ne "refs/heads/main") { throw "releases are published from main only" }
            $publish = $true
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Output "release: $publish ($tag)"

      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --group build --python "${{ steps.python.outputs.python-path }}"

      - name: Test
        run: uv run pytest -q

      - name: Stamp the build number
        # Shown in the app's title bar, e.g. "Spline Wire 0.5.0 (build 12, 8bdccf7)".
        run: uv run python packaging/stamp_build.py

      - name: Build SplineWire.exe
        run: uv run python packaging/build_exe.py

      - name: Smoke-test the exe
        shell: pwsh
        run: |
          $log = Join-Path $PWD "selftest.log"
          $p = Start-Process -FilePath "dist\SplineWire.exe" -ArgumentList "--selftest", "`"$log`"" -Wait -PassThru
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }

      - name: Generate test plaques
        shell: pwsh
        run: |
          foreach ($shape in "s-curve", "pipe", "cove") {
            uv run splinewire test-plaque --shape $shape --out dist/test-plaques
            if ($LASTEXITCODE -ne 0) { throw "test-plaque $shape failed" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: SplineWire-test-plaques
          path: dist/test-plaques/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: SplineWire-windows
          path: dist/SplineWire.exe
          if-no-files-found: error

      - name: Publish the release
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          Compress-Archive -Path dist/test-plaques/* -DestinationPath dist/SplineWire-test-plaques.zip
          # Creates the tag at this commit if it doesn't exist yet.
          gh release create "$env:TAG" dist/SplineWire.exe dist/SplineWire-test-plaques.zip --target "${{ github.sha }}" --title "SplineWire $env:TAG" --generate-notes
