name: Python

# The Python package's test suite (pytest), on Linux. Python is the reference
# implementation the website's TypeScript port is checked against.

on:
  push:
    branches: ["**"]
    paths:
      - "splinewire/**"
      - "data/**"
      - "fusion/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync

      - name: Test
        run: uv run pytest -q
