[project]
name = "spline-wire"
version = "0.1.0"
description = "Measure real-world curves with a fiducial chain and a phone photo"
authors = [
    { name = "micah", email = "mookerish@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "pyyaml>=6.0",
    "scipy>=1.14",
]

[project.scripts]
splinewire = "splinewire.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["splinewire"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
